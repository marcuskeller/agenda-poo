<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de contato | Agenda Telefônica</title>
    <link rel="stylesheet" href="assets/agenda.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html" aria-label="Agenda, ir para contatos">
            <span class="brand-mark" aria-hidden="true">A</span>
            <span class="brand-copy">
                <span class="brand-name">agenda</span>
                <span class="brand-caption">Caderno de contatos</span>
            </span>
        </a>
        <span class="header-caption">Organização pessoal / 01</span>
        <a class="header-link" href="index.html">Todos os contatos</a>
    </header>

    <main class="page-shell form-shell">
        <section class="page-intro" aria-labelledby="page-title">
            <div>
                <p class="eyebrow">Dados do contato</p>
                <h1 id="page-title">Formulário de contato</h1>
            </div>
        </section>

        <section class="surface form-surface" aria-label="Dados do contato">
            <p class="form-section-label">Informações pessoais</p>
            <form>
                <div class="form-grid">
                    <div class="field field--wide">
                        <label class="field-label" for="nome">Nome <span class="required-mark" aria-hidden="true">*</span></label>
                        <input class="field-input" id="nome" name="nome" type="text" maxlength="100" autocomplete="name" required placeholder="Nome completo">
                    </div>
                    <div class="field">
                        <label class="field-label" for="telefone">Telefone <span class="required-mark" aria-hidden="true">*</span></label>
                        <input class="field-input" id="telefone" name="telefone" type="tel" maxlength="20" autocomplete="tel" required placeholder="(00) 00000-0000">
                    </div>
                    <div class="field">
                        <label class="field-label" for="email">E-mail</label>
                        <input class="field-input" id="email" name="email" type="email" maxlength="100" autocomplete="email" placeholder="nome@exemplo.com">
                    </div>
                </div>

                <hr class="form-divider">
                <p class="form-note">O salvamento estará disponível após a conexão com o backend.</p>
                <div class="form-actions">
                    <p class="form-note"><span class="required-mark" aria-hidden="true">*</span> Campos obrigatórios</p>
                    <div class="form-action-group">
                        <a class="button-link" href="index.html">Cancelar</a>
                        <button class="button-primary" type="button" disabled>Salvar contato</button>
                    </div>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
